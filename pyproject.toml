[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frontis-mila"
version = "0.1.0"
description = "Recorded CPU Frontis-controller experiments through OpenCode"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6", "httpx>=0.27", "numpy", "pandas", "scikit-learn"]

[project.scripts]
frontis = "frontis_mila.cli:main"

[tool.setuptools.packages.find]
include = ["frontis_mila*", "frontis_local*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
